<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Editor</title>
    <script type="module" src="/js/player.js"></script>
</head>

<body>
    <div class="main-container">
        <div class="video-container no-video" id="dropContainer">
            <div class="video-wrapper">
                <video id="video"></video>
                <div class="drop-zone">
                    <div class="clickable-area">
                        <div class="drop-message">Click here</div>
                    </div>
                    <div class="url-input-container">
                        <input type="text" id="videoUrlInput" placeholder="Or paste a video URL" class="url-input">
                        <button id="loadUrlButton" class="url-button">Load</button>
                    </div>
                    <div class="drop-error" id="dropError"></div>
                </div>
                <div class="volume-indicator" id="volumeIndicator">
                    <img src="/assets/icons/volume.svg" class="volume-icon" id="volumeIcon">
                    <span id="volumeText" class="volume-text">100%</span>
                </div>
            </div>
            <div id="progressContainer" class="progress-container">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                    <div id="progressHandle" class="progress-handle"></div>
                </div>
                <div id="progressHoverTime" class="progress-hover-time"></div>
            </div>
        </div>

        <div class="controls">
            <div class="editor-row">
                <div class="editor-panels">
                    <div class="compress" id="compress">
                        <div class="compress-content">
                            <div class="compress-select-container">
                                <label class="compress-label">Video Codec</label>
                                <select class="compress-select" id="video-codec-select"></select>
                            </div>
                            <div class="compress-select-container">
                                <label class="compress-label">Audio Codec</label>
                                <select class="compress-select" id="audio-codec-select"></select>
                            </div>
                            <div class="compress-select-container">
                                <label class="compress-label" for="quality-slider">Quality</label>
                                <div class="slider-container">
                                    <input type="range" id="quality-slider" class="compress-slider" min="0" max="100"
                                        value="75" />
                                    <span class="slider-value">75%</span>
                                </div>
                            </div>
                            <button class="compress-save-button">Save</button>
                        </div>
                    </div>
                    <div class="crop" id="crop">
                        <div class="crop-content">
                            <div class="crop-controls">
                                <button class="editor-button" id="no-crop-button">✕</button>
                                <select class="crop-select" id="ratio-select"></select>
                                <button class="editor-button" id="center-crop-button">⊕</button>
                                <button class="editor-button" id="flip-orientation-button"></button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="editor-button" id="trim-button">✂️</button>
                <button class="editor-button" id="crop-button">⌗</button>
                <!-- <button class="editor-button">🔊</button> -->
                <button class="editor-button" id="compress-button">🗜️</button>
                <button class="editor-button" id="save-button">💾</button>
            </div>
            <div class="header">
                <div class="fps-display" id="fpsDisplay"></div>
                <div class="control-buttons">
                    <div class="tooltip" id="tooltip"></div>
                    <button class="icon-btn" id="loopBtn">
                        <img src="/assets/icons/loop.svg" alt="Loop">
                    </button>
                    <button class="icon-btn" id="helpBtn">
                        <img src="/assets/icons/help.svg" alt="Help">
                    </button>
                    <div id="helpTip" class="help-tip"></div>
                    <button class="icon-btn" id="themeBtn">☀️</button>
                </div>
            </div>

            <div class="button-row">
                <button>-1s</button>
                <button>Prev Frame</button>
                <button class="play-button">▶</button>
                <button>Next Frame</button>
                <button>+1s</button>
            </div>

            <div class="time-display">
                Time: <span id="timeDisplay">0.000s</span>
                Frame: <span id="frameDisplay">0</span>
            </div>
        </div>
    </div>
</body>

</html>
