<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script type="module" src="/js/player.js"></script>
</head>

<body>
    <div id="splash">
        <div class="logo-container">
            <img src="assets/icons/video-editor-icon.png" alt="Loading..." draggable="false" />
        </div>
    </div>
    <div class="main-container">
        <div class="video-container add-media" id="dropContainer">
            <div class="video-wrapper">
                <video id="video" class="video-js" data-setup='{}'>
                </video>
                <div class="drop-zone">
                    <div tabindex="10" class="clickable-area">
                        <div class="drop-message">Click to Open</div>
                    </div>
                    <div class="url-input-container">
                        <div class="url-input-wrapper">
                            <input tabindex="20" type="text" id="videoUrlInput" placeholder="paste a URL or search"
                                class="url-input">
                            <div class="url-search-spinner" id="urlSearchSpinner"></div>
                        </div>
                        <button tabindex="20" id="loadUrlButton" class="url-button">Load</button>
                    </div>
                </div>
                <div class="volume-indicator" id="volumeIndicator">
                    <img src="/assets/icons/volume.svg" class="volume-icon" id="volumeIcon">
                    <span id="volumeText" class="volume-text">100%</span>
                </div>
            </div>
            <div id="progressContainer" class="progress-container">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                    <div id="progressHandle" class="progress-handle"></div>
                </div>
                <div id="progressHover" class="progress-hover">
                    <span id="progressHoverTime"></span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="editor-row">
                <div class="editor-panels">
                    <div class="compress" id="compress">
                        <div class="compress-content">
                            <div class="compress-select-container">
                                <label class="compress-label">Video Codec</label>
                                <select tabindex="91" class="compress-select" id="video-codec-select"></select>
                            </div>
                            <div class="compress-select-container">
                                <label class="compress-label">Audio Codec</label>
                                <select tabindex="91" class="compress-select" id="audio-codec-select"></select>
                            </div>
                            <div class="compress-select-container">
                                <label class="compress-label" for="quality-slider">Quality</label>
                                <div class="slider-container">
                                    <input tabindex="91" type="range" id="quality-slider" class="compress-slider"
                                        min="0" max="100" value="75" />
                                    <span class="slider-value">75%</span>
                                </div>
                            </div>
                            <button tabindex="91" class="compress-save-button">Save</button>
                        </div>
                    </div>
                    <div class="crop" id="crop">
                        <div class="crop-content">
                            <div class="crop-controls">
                                <button tabindex="81" class="editor-button" id="no-crop-button">✕</button>
                                <select tabindex="81" class="crop-select" id="ratio-select"></select>
                                <button tabindex="81" class="editor-button" id="center-crop-button">⊕</button>
                                <button tabindex="81" class="editor-button" id="flip-orientation-button"></button>
                            </div>
                        </div>
                    </div>
                </div>
                <button tabindex="70" class="editor-button" id="trim-button">✂️</button>
                <button tabindex="80" class="editor-button" id="crop-button">⌗</button>
                <!-- <button tabindex="3" class="editor-button">🔊</button> -->
                <button tabindex="90" class="editor-button" id="compress-button">🗜️</button>
                <button tabindex="100" class="editor-button" id="save-button">💾</button>
            </div>
            <div class="header">
                <div class="fps-display" id="fpsDisplay"></div>
                <div class="control-buttons">
                    <div class="tooltip" id="tooltip"></div>
                    <button class="icon-btn" id="loopBtn">
                        <img src="/assets/icons/loop.svg" alt="Loop">
                    </button>
                    <button class="icon-btn" id="helpBtn">
                        <img src="/assets/icons/help.svg" alt="Help">
                    </button>
                    <div id="helpTip" class="help-tip"></div>
                    <button class="icon-btn" id="themeBtn">🌙</button>
                </div>
            </div>

            <div class="button-row">
                <button tabindex="30" class="editor-button">📁</button>
                <button tabindex="40">-1s</button>
                <button tabindex="50" class="play-button">▶</button>
                <button tabindex="60">+1s</button>
            </div>

            <div class="time-display">
                Time: <span id="timeDisplay">0.000s</span>
                Frame: <span id="frameDisplay">0</span>
            </div>
        </div>
        <div id="global-notification"></div>
    </div>
</body>

</html>
